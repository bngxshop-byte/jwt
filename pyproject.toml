[project]
name = "freefire-api"
version = "1.0.0"
description = "Free Fire Login API"
requires-python = ">=3.11"
dependencies = [
    "Flask==2.3.3",
    "requests==2.31.0",
    "pycryptodome==3.19.0",
    "blackboxprotobuf==1.0.1",
    "google-play-scraper==1.2.4",
    "urllib3==2.0.7",
    "certifi==2023.11.17",
    "charset-normalizer==3.3.2",
    "idna==3.6",
    "protobuf==4.25.1",
    "click==8.1.7",
    "itsdangerous==2.1.2",
    "Jinja2==3.1.2",
    "MarkupSafe==2.1.3",
    "Werkzeug==2.3.7"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []
